groups:
  # ──────────────────────────────────────────────
  # dash0.check.status
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.status
    type: metric
    metric_name: dash0.check.status
    stability: stable
    brief: >
      Encodes the current state of a check as an enum.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      The check's overall state after grace-period logic has been applied.

      | Value | Name | Description |
      |-------|------|-------------|
      | `-Inf` | `inactive` | The check is inactive (enablement conditions not met, or the check is disabled). |
      | `0` | `healthy` | The check is passing; no thresholds have been exceeded. |
      | `0.5` | `pending` | Within the trigger grace period — the threshold has been exceeded but not long enough to transition to degraded or critical. |
      | `1` | `degraded` | The check has exceeded the degraded threshold and the grace period has elapsed. |
      | `2` | `critical` | The check has exceeded the critical threshold and the grace period has elapsed. |

      Deprecated PromQL alias: `dash0_check_status`.
    instrument: gauge
    unit: "{enum}"

  - id: metric.dash0_check_status
    type: metric
    metric_name: dash0_check_status
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.status
    brief: >
      Deprecated Prometheus alias for `dash0.check.status`.
    instrument: gauge
    unit: "{enum}"

  # ──────────────────────────────────────────────
  # dash0.check.evaluation.outcome
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.evaluation.outcome
    type: metric
    metric_name: dash0.check.evaluation.outcome
    stability: stable
    brief: >
      Encodes the outcome of check evaluations as an enum.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      Encodes the immediate result of each evaluation cycle, before grace-period logic is applied.
      Unlike `dash0.check.status`, this metric has no `pending` state.

      | Value | Name | Description |
      |-------|------|-------------|
      | `-Inf` | `inactive` | Enablement conditions were not met; the evaluation did not run. |
      | `0` | `healthy` | The evaluation result did not exceed any threshold. |
      | `1` | `degraded` | The result exceeded the degraded threshold but not the critical threshold. |
      | `2` | `critical` | The result exceeded the critical threshold. |

      Deprecated PromQL alias: `dash0_check_evaluation_outcome`.
    instrument: gauge
    unit: "{enum}"

  - id: metric.dash0_check_evaluation_outcome
    type: metric
    metric_name: dash0_check_evaluation_outcome
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.evaluation.outcome
    brief: >
      Deprecated Prometheus alias for `dash0.check.evaluation.outcome`.
    instrument: gauge
    unit: "{enum}"

  # ──────────────────────────────────────────────
  # dash0.check.evaluation.value
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.evaluation.value
    type: metric
    metric_name: dash0.check.evaluation.value
    stability: stable
    brief: >
      The value returned by a check evaluation.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).

      Deprecated PromQL alias: `dash0_check_evaluation_value`.
    instrument: gauge
    unit: "1"

  - id: metric.dash0_check_evaluation_value
    type: metric
    metric_name: dash0_check_evaluation_value
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.evaluation.value
    brief: >
      Deprecated Prometheus alias for `dash0.check.evaluation.value`.
    instrument: gauge
    unit: "1"

  # ──────────────────────────────────────────────
  # dash0.check.enablement_conditions.value
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.enablement_conditions.value
    type: metric
    metric_name: dash0.check.enablement_conditions.value
    stability: stable
    brief: >
      Encodes whether a check's enablement condition passed.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      The value is `1` when the condition passed and `0` when it failed.

      When a check rule has multiple enablement conditions, one data point is
      emitted per condition. The `dash0.enablement_condition.index` attribute
      (1-based: 1, 2, 3, …) identifies which condition the data point relates to.

      Deprecated PromQL alias: `dash0_check_enablement_conditions_value`.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: dash0.enablement_condition.index
        requirement_level: required

  - id: metric.dash0_check_enablement_conditions_value
    type: metric
    metric_name: dash0_check_enablement_conditions_value
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.enablement_conditions.value
    brief: >
      Deprecated Prometheus alias for `dash0.check.enablement_conditions.value`.
    instrument: gauge
    unit: "1"

  # ──────────────────────────────────────────────
  # dash0.check.threshold.critical
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.threshold.critical
    type: metric
    metric_name: dash0.check.threshold.critical
    stability: stable
    brief: >
      Represents the critical threshold configured for a check rule.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      The value mirrors the critical threshold setting of the check rule, allowing
      dashboards and queries to compare the evaluation value against its threshold.

      Deprecated PromQL alias: `dash0_check_threshold_critical`.
    instrument: gauge
    unit: "1"

  - id: metric.dash0_check_threshold_critical
    type: metric
    metric_name: dash0_check_threshold_critical
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.threshold.critical
    brief: >
      Deprecated Prometheus alias for `dash0.check.threshold.critical`.
    instrument: gauge
    unit: "1"

  # ──────────────────────────────────────────────
  # dash0.check.threshold.degraded
  # ──────────────────────────────────────────────
  - id: metric.dash0.check.threshold.degraded
    type: metric
    metric_name: dash0.check.threshold.degraded
    stability: stable
    brief: >
      Represents the degraded threshold configured for a check rule.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      The value mirrors the degraded threshold setting of the check rule, allowing
      dashboards and queries to compare the evaluation value against its threshold.

      Deprecated PromQL alias: `dash0_check_threshold_degraded`.
    instrument: gauge
    unit: "1"

  - id: metric.dash0_check_threshold_degraded
    type: metric
    metric_name: dash0_check_threshold_degraded
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.check.threshold.degraded
    brief: >
      Deprecated Prometheus alias for `dash0.check.threshold.degraded`.
    instrument: gauge
    unit: "1"

  # ──────────────────────────────────────────────
  # dash0.issue.status
  # ──────────────────────────────────────────────
  - id: metric.dash0.issue.status
    type: metric
    metric_name: dash0.issue.status
    stability: stable
    brief: >
      Encodes the current issue status as an enum.
    note: |
      Emitted by the check evaluation pipeline (scope `dash0-issue-metrics`).
      Issues are created when a check rule transitions to a failed state.
      This metric only exists for checks that are currently failing — there are no healthy, pending, or inactive values.

      | Value | Name | Description |
      |-------|------|-------------|
      | `1.0` | `degraded` | The issue represents one or more checks in degraded state. |
      | `2.0` | `critical` | The issue represents one or more checks in critical state. |

      Deprecated PromQL alias: `dash0_issue_status`.
    instrument: gauge
    unit: "{enum}"

  - id: metric.dash0_issue_status
    type: metric
    metric_name: dash0_issue_status
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.issue.status
    brief: >
      Deprecated Prometheus alias for `dash0.issue.status`.
    instrument: gauge
    unit: "{enum}"
