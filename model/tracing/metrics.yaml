groups:
  # ──────────────────────────────────────────────
  # dash0.spans
  # ──────────────────────────────────────────────
  - id: metric.dash0.spans
    type: metric
    metric_name: dash0.spans
    stability: stable
    brief: >
      Counts the number of spans ingested by Dash0.
    note: |
      [synthetic: spans, resources]
      `dash0.spans` is a synthetic metric: it is not stored as a metric time series,
      but computed on-the-fly from the ingested span data. It can be filtered and
      grouped by any span or resource attribute.

      `dash0.spans` counts the spans that Dash0 received and stored, so it is not a measure of the total request rate of a sampled service.
      If spans are sampled before they reach Dash0, for example with head sampling in the SDK or tail sampling in a collector, the count reflects only the spans that were forwarded, and sampling that Dash0 applies at ingestion reduces it further.
      For request rates that do not depend on the sampling Dash0 applies at ingestion, use `dash0.spans.red`, which is computed before that sampling decision is made.

      Deprecated PromQL alias: `dash0_spans_total`.

      For example:
      `sum by (service_name) ({otel_metric_name="dash0.spans"})` yields one
      time series per value of `service.name`.
    instrument: counter
    unit: "{span}"

  - id: metric.dash0_spans_total
    type: metric
    metric_name: dash0_spans_total
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.spans
    brief: >
      Deprecated Prometheus alias for `dash0.spans`.
    instrument: counter
    unit: "{span}"

  # ──────────────────────────────────────────────
  # dash0.spans.duration
  # ──────────────────────────────────────────────
  - id: metric.dash0.spans.duration
    type: metric
    metric_name: dash0.spans.duration
    stability: stable
    brief: >
      Distribution of span durations as a histogram.
    note: |
      [synthetic: spans, resources]
      `dash0.spans.duration` is a synthetic metric: it is not stored as a metric
      time series, but computed on-the-fly from the ingested span data. It can be
      filtered and grouped by any span or resource attribute.

      `dash0.spans.duration` describes the spans that Dash0 received and stored, not every span a service produced.
      If spans are sampled before they reach Dash0, for example with head sampling in the SDK or tail sampling in a collector, the distribution describes only the spans that were forwarded, and sampling that Dash0 applies at ingestion narrows it further.
      Sampling that is biased toward particular spans, such as tail sampling that keeps errors and slow requests, skews the distribution accordingly.
      For latency distributions that do not depend on the sampling Dash0 applies at ingestion, use `dash0.spans.red`, which is computed before that sampling decision is made.

      Deprecated PromQL aliases: `dash0_spans_duration_seconds_bucket`,
      `dash0_spans_duration_seconds_sum`, `dash0_spans_duration_seconds_count`.

    instrument: histogram
    unit: "s"

  - id: metric.dash0_spans_duration_seconds
    type: metric
    metric_name: dash0_spans_duration_seconds
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.spans.duration
    brief: >
      Deprecated Prometheus alias for `dash0.spans.duration`.
    note: |
      [synthetic]
      Exposed in Prometheus as `dash0_spans_duration_seconds_bucket`,
      `dash0_spans_duration_seconds_sum`, and `dash0_spans_duration_seconds_count`.
    instrument: histogram
    unit: "s"

  # ──────────────────────────────────────────────
  # dash0.span.events
  # ──────────────────────────────────────────────
  - id: metric.dash0.span.events
    type: metric
    metric_name: dash0.span.events
    stability: stable
    brief: >
      Counts the number of span events ingested by Dash0.
    note: |
      [synthetic: spans, resources]
      `dash0.span.events` is a synthetic metric: it is not stored as a metric time
      series, but computed on-the-fly from the ingested tracing data. It can be
      filtered and grouped by any span event or resource attribute.

      Deprecated PromQL alias: `dash0_span_events_total`.

    instrument: counter
    unit: "{span_event}"

  - id: metric.dash0_span_events_total
    type: metric
    metric_name: dash0_span_events_total
    stability: stable
    deprecated:
      reason: renamed
      renamed_to: dash0.span.events
    brief: >
      Deprecated Prometheus alias for `dash0.span.events`.
    instrument: counter
    unit: "{span_event}"
