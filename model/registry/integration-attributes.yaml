groups:
  - id: registry.dash0.integration
    type: attribute_group
    display_name: Dash0 Integration Attributes
    brief: Resource attributes set on telemetry that a Dash0 cloud integration collects.
    attributes:
      - id: dash0.integration.id
        type: string
        stability: development
        brief: >
          The ID of the Dash0 integration that collected the telemetry.
        note: |
          Set on the resources and metrics that a Dash0 AWS or GCP integration collects.
          Telemetry that is sent to Dash0 directly does not carry it.
        examples: ["8f6e2a10-7f2d-4f6a-a09f-0a9f5c2d8e11"]
        annotations:
          dash0:
            transform_access: read

      - id: dash0.cloud.tags
        type: template[string]
        stability: development
        brief: >
          A tag of the cloud resource, where `<key>` is the tag key and the attribute value is the tag value.
        note: |
          Set on the resources that a Dash0 AWS integration discovers, with one attribute per AWS resource tag.
          For example, the tag `team=payments` becomes `dash0.cloud.tags.team` with the value `payments`.
        examples: ["payments"]
        annotations:
          dash0:
            transform_access: read
