groups:
  # ──────────────────────────────────────────────
  # dash0.slo.target
  # ──────────────────────────────────────────────
  - id: metric.dash0.slo.target
    type: metric
    metric_name: dash0.slo.target
    stability: development
    brief: >
      The SLO's objective target as a fraction (e.g. 0.999).
    note: |
      Constant value per SLO in the range (0, 1). The allowed error budget is `1 - target`; both
      `dash0.slo.burn_rate.<window>` and `dash0.slo.budget.remaining` use this
      as the reference.
    instrument: gauge
    unit: "1"
    attributes: &slo_attrs
      - ref: dash0.slo.id
        requirement_level: required
      - ref: dash0.slo.name
        requirement_level: required

  # ──────────────────────────────────────────────
  # dash0.slo.success_ratio
  # ──────────────────────────────────────────────
  - id: metric.dash0.slo.success_ratio
    type: metric
    metric_name: dash0.slo.success_ratio
    stability: development
    brief: >
      The SLO's overall success ratio over its compliance window.
    note: |
      Computed as good events divided by total events over the full SLO compliance window, for example 28 days.
      Range [0, 1]; `1.0` means every event in the window was good.
      This is the value that decides whether the SLO met its objective.
      Only two success ratios are recorded: this metric over the compliance window and `dash0.slo.success_ratio.7d`.
      The 5min, 30min, 1h, 2h, 6h, 1d, and 3d windows derive their ratio from `dash0.slo.burn_rate.<window>` as `1 - dash0.slo.burn_rate.<window> * (1 - dash0.slo.target)`, reading both series at the same instant.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.success_ratio.7d
    type: metric
    metric_name: dash0.slo.success_ratio.7d
    stability: development
    brief: >
      Success ratio over the trailing 7-day window.
    note: |
      Computed as good events divided by total events over the window.
      Range [0, 1]; `1.0` means every event in the window was good.
      Only two success ratios are recorded: `dash0.slo.success_ratio` over the compliance window and this metric.
      The 5min, 30min, 1h, 2h, 6h, 1d, and 3d windows derive their ratio from `dash0.slo.burn_rate.<window>` as `1 - dash0.slo.burn_rate.<window> * (1 - dash0.slo.target)`, reading both series at the same instant.
      There is deliberately no `dash0.slo.burn_rate.7d` companion: burn-rate alert windows stop at 3 days, and the 7-day success ratio exists for compliance display only.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  # ──────────────────────────────────────────────
  # dash0.slo.burn_rate.<window>
  # ──────────────────────────────────────────────
  - id: metric.dash0.slo.burn_rate.5min
    type: metric
    metric_name: dash0.slo.burn_rate.5min
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 5-minute lookback window.
    note: |
      Value is the ratio of the observed failure rate in the window (1 minus the success ratio) to the allowed budget
      fraction (1 minus the target). A value of 1.0 means the budget is being
      consumed at exactly the allowed rate; a value of 14.4 means it is being
      consumed 14.4x faster than allowed.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.30min
    type: metric
    metric_name: dash0.slo.burn_rate.30min
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 30-minute lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.1h
    type: metric
    metric_name: dash0.slo.burn_rate.1h
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 1-hour lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.2h
    type: metric
    metric_name: dash0.slo.burn_rate.2h
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 2-hour lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.6h
    type: metric
    metric_name: dash0.slo.burn_rate.6h
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 6-hour lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.1d
    type: metric
    metric_name: dash0.slo.burn_rate.1d
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 1-day lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.3d
    type: metric
    metric_name: dash0.slo.burn_rate.3d
    stability: development
    brief: >
      Pre-aggregated SLO burn rate over a 3-day lookback window.
    note: |
      See `dash0.slo.burn_rate.5min` for value semantics.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.fast
    type: metric
    metric_name: dash0.slo.burn_rate.fast
    stability: development
    brief: >
      Fast-burn pressure: how close the fast multi-window tiers are to firing,
      scaled so that 1 means a tier is at its threshold.
    note: |
      Google SRE multi-window multi-burn-rate, fast tier, pre-composed so an
      alert can target one series instead of writing the AND of two windows.
      The value is continuous, not a 0/1 flag. For each tier it is the smaller
      of the tier's long-window and short-window burn rates divided by the tier
      threshold, and the recorded value is the larger of the two tiers. `1`
      means a tier is exactly at its threshold, above `1` is how far past it,
      below `1` is how close. Alert with `>= 1`. A tier only contributes while
      both of its burn rate series have a sample, so a missing input leaves the
      tier out instead of reading `0`. A tier threshold is the tier's budget
      share times the SLO window divided by the tier's long window, never below
      1. Tiers for a 28 day window SLO:
        critical: `dash0.slo.burn_rate.1h` with `dash0.slo.burn_rate.5min`, threshold 13.44 (2% of the budget in 1h)
        high: `dash0.slo.burn_rate.6h` with `dash0.slo.burn_rate.30min`, threshold 5.6 (5% of the budget in 6h)
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  - id: metric.dash0.slo.burn_rate.slow
    type: metric
    metric_name: dash0.slo.burn_rate.slow
    stability: development
    brief: >
      Slow-burn pressure: how close the slow multi-window tiers are to firing,
      scaled so that 1 means a tier is at its threshold.
    note: |
      Google SRE multi-window multi-burn-rate, slow tier, pre-composed so an
      alert can target one series instead of writing the AND of two windows.
      Same value semantics as `dash0.slo.burn_rate.fast`: continuous, the larger
      over the two slow tiers of the smaller of the tier's two burn rates
      divided by the tier threshold, `1` means a tier is at its threshold, and
      a tier with a missing input is left out. Tiers for a 28 day window SLO:
        warning: `dash0.slo.burn_rate.1d` with `dash0.slo.burn_rate.2h`, threshold 2.8 (10% of the budget in 1 day)
        break-even: `dash0.slo.burn_rate.3d` with `dash0.slo.burn_rate.6h`, threshold 1 (10% of the budget in 3 days is 0.93, raised to the floor of 1)
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  # ──────────────────────────────────────────────
  # dash0.slo.budget.remaining
  # ──────────────────────────────────────────────
  - id: metric.dash0.slo.budget.remaining
    type: metric
    metric_name: dash0.slo.budget.remaining
    stability: development
    brief: >
      Remaining error budget as a fraction of the original budget.
    note: |
      `1.0` means the budget is fully intact and `0.0` means it is fully exhausted. The range is
      (-inf, 1]: only the upper bound is clamped, so an over-budget SLO reads
      negative and a burndown chart can render the breach below the axis. A
      value at or below zero means the budget is exhausted and the SLO is in
      violation; the magnitude says by how much.
    instrument: gauge
    unit: "1"
    attributes: *slo_attrs

  # ──────────────────────────────────────────────
  # dash0.slo.events.<good>.<window>
  # ──────────────────────────────────────────────
  - id: metric.dash0.slo.events.good.5min
    type: metric
    metric_name: dash0.slo.events.good.5min
    stability: development
    brief: >
      Count of good events over the trailing 5-minute window.
    note: |
      The numerator of the success ratio over the 5-minute window.
      Feeds the short-window burn-rate recording rules.
    instrument: gauge
    unit: "{event}"
    attributes: *slo_attrs

  - id: metric.dash0.slo.events.good.1h
    type: metric
    metric_name: dash0.slo.events.good.1h
    stability: development
    brief: >
      Rolling 1-hour sum of the `dash0.slo.events.good.5min` samples.
    note: |
      Not a count of good events. `dash0.slo.events.good.5min` is recorded every
      minute and each sample covers the trailing 5 minutes, so the hourly sum
      adds about 60 overlapping samples and reads roughly 5 times the number of
      good events in the hour. It is the numerator of the success ratios, burn
      rates, and `dash0.slo.budget.remaining` for the 6h and longer windows. Use
      it only in a ratio against `dash0.slo.events.1h`, where the overlap
      cancels.
    instrument: gauge
    unit: "{event}"
    attributes: *slo_attrs

  - id: metric.dash0.slo.events.5min
    type: metric
    metric_name: dash0.slo.events.5min
    stability: development
    brief: >
      Count of total eligible events over the trailing 5-minute window.
    note: |
      The denominator of the success ratio over the 5-minute window. Only events eligible for the SLI are counted;
      events excluded by the SLI filter are not.
    instrument: gauge
    unit: "{event}"
    attributes: *slo_attrs

  - id: metric.dash0.slo.events.1h
    type: metric
    metric_name: dash0.slo.events.1h
    stability: development
    brief: >
      Rolling 1-hour sum of the `dash0.slo.events.5min` samples.
    note: |
      Not a count of events. `dash0.slo.events.5min` is recorded every minute
      and each sample covers the trailing 5 minutes, so the hourly sum adds
      about 60 overlapping samples and reads roughly 5 times the number of
      eligible events in the hour. It is the denominator of the success ratios,
      burn rates, and `dash0.slo.budget.remaining` for the 6h and longer
      windows. Use it only in a ratio against `dash0.slo.events.good.1h`, where
      the overlap cancels.
    instrument: gauge
    unit: "{event}"
    attributes: *slo_attrs
