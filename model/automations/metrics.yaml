groups:
  # ──────────────────────────────────────────────
  # dash0.automations.run
  # ──────────────────────────────────────────────
  - id: metric.dash0.automations.run
    type: metric
    metric_name: dash0.automations.run
    stability: development
    brief: >
      Number of Agent0 automation runs, by terminal status.
    note: |
      Published into the triggering organization's own dataset, so it can be
      queried directly.
    instrument: counter
    unit: "{run}"
    attributes:
      - ref: dash0.automation.id
        requirement_level: required
      - ref: dash0.automation.status
        requirement_level: required

  # ──────────────────────────────────────────────
  # dash0.automations.credits.usage
  # ──────────────────────────────────────────────
  - id: metric.dash0.automations.credits.usage
    type: metric
    metric_name: dash0.automations.credits.usage
    stability: development
    brief: >
      Credits consumed by Agent0 automation invocations, per organization.
    note: |
      Published into the triggering organization's own dataset, so it can be
      queried directly.
    instrument: counter
    unit: "{credit}"
    attributes:
      - ref: dash0.automation.id
        requirement_level: required
