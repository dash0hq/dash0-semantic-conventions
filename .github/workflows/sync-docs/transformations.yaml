#
# This file configures how Weaver-generated semantic convention docs are adapted
# before syncing to the Dash0 website via dash0hq/sync-docs-action.
#
# Source paths are relative to docs-website/ (the website-template output directory).
# Target paths are relative to SYNC_DOCUMENTATION_TARGET_DIRECTORY
# (src/app/(core)/docs/content/).
#
# Whenever a new convention group is added to the model/, add a new entry to the
# files: block below; the coverage block will catch any misses in CI.

nav:
  target: dash0/opentelemetry/semconvs/nav.json
  order: 66
  id: semconvs
  parentPath: OpenTelemetry
  title: Dash0 Semantic Conventions
  groupTitles:
    attributes: Attributes
    metrics: Metrics
    events: Events

common:
  - description: remove the leading top-level heading (the frontmatter title replaces it)
    type: replace-regex
    find: '^#\s+[^\n]*\n'
    replace: ''
    flags:
      - multiline

  - description: strip .md extension from relative links (website uses extensionless URLs)
    type: replace-regex
    find: '\.md([)#])'
    replace: '\1'
    flags:
      - multiline
    required: false

coverage:
  include:
    - "**/*.md"
  ignore: []

files:
  - source: README.md
    target: dash0/opentelemetry/semconvs/overview.md
    title: Overview
    description: Overview of the Dash0 semantic conventions registry.

  - source: attributes/README.md
    target: dash0/opentelemetry/semconvs/attributes/overview.md
    title: Attribute Registry
    description: All Dash0-defined attributes, organised by namespace.

  - source: attributes/log.md
    target: dash0/opentelemetry/semconvs/attributes/log.md
    title: Log Attributes
    description: Attributes that Dash0 can add to log records or the associated resources.

  - source: attributes/metric.md
    target: dash0/opentelemetry/semconvs/attributes/metric.md
    title: Metric Attributes
    description: Attributes that Dash0 can add to metrics or the associated resources.

