name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-registry:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check model
        run: make check

      - name: Resolve registry
        run: make resolve

  live-check-tests:
    name: Live-Check Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run live-check tests
        run: make test

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@6efae3022af925deab04aa70924cd501443fb7f9 # v0.21.2

      - name: Generate registry documentation
        run: ./scripts/generate-docs.sh

      - name: Upload documentation artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: registry-docs
          path: ./docs/
          if-no-files-found: warn

  sync-docs-dry-run:
    name: Sync Docs Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@6efae3022af925deab04aa70924cd501443fb7f9 # v0.21.2

      - name: Generate website documentation
        run: ./scripts/generate-docs.sh ./docs-website/ website

      - name: Sync docs dry run
        uses: dash0hq/sync-docs-action@3fbe55fed800da21ee24d6b6dba1a86435f61565 # v0.4.0
        with:
          source-root: ./docs-website/
          transformations-file: ../.github/workflows/sync-docs/transformations.yaml
          dry-run: "true"
